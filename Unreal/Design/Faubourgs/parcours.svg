<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660"><rect width="1440" height="660" fill="#10242d"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#eff2ea;font-size:18px}.small{font-size:14px;fill:#b2cace}</style><text x="40" y="48" style="font-size:30px;font-weight:bold">FAUBOURGS NOYÉS · DIX LIEUX, UN VOYAGE</text><text x="40" y="84" class="small">Suivre le canal jusqu’à l’écluse, puis les conduites jusqu’aux pompes. Proposition de composition, pas dix nouvelles cartes réalisées.</text><rect x="40" y="140" width="250" height="160" rx="12" fill="#28505a"/><text x="58" y="175" fill="#f2c771">01</text><text x="58" y="220">Quai des évacués</text><text x="58" y="253" class="small">Arrivée  /  boucle  /  signal</text><path d="M297 223h18m-6 -5l6 5 -6 5" stroke="#eff2ea" stroke-width="2" fill="none"/><rect x="320" y="140" width="250" height="160" rx="12" fill="#28505a"/><text x="338" y="175" fill="#f2c771">02</text><text x="338" y="220">Rue des vannes</text><text x="338" y="253" class="small">Rue en coude + placette</text><path d="M577 223h18m-6 -5l6 5 -6 5" stroke="#eff2ea" stroke-width="2" fill="none"/><rect x="600" y="140" width="250" height="160" rx="12" fill="#28505a"/><text x="618" y="175" fill="#f2c771">03</text><text x="618" y="220">Entrepôt</text><text x="618" y="253" class="small">Diagonale entre trois travées</text><path d="M857 223h18m-6 -5l6 5 -6 5" stroke="#eff2ea" stroke-width="2" fill="none"/><rect x="880" y="140" width="250" height="160" rx="12" fill="#28505a"/><text x="898" y="175" fill="#f2c771">04</text><text x="898" y="220">Canal</text><text x="898" y="253" class="small">Deux rives, deux traversées</text><path d="M1137 223h18m-6 -5l6 5 -6 5" stroke="#eff2ea" stroke-width="2" fill="none"/><rect x="1160" y="140" width="250" height="160" rx="12" fill="#986c50"/><text x="1178" y="175" fill="#f2c771">05</text><text x="1178" y="220">Écluse · BOSS</text><text x="1178" y="253" class="small">U ouvert autour du bassin</text><rect x="1160" y="375" width="250" height="160" rx="12" fill="#28505a"/><text x="1178" y="410" fill="#f2c771">06</text><text x="1178" y="455">Marché submergé</text><text x="1178" y="488" class="small">Éventail, cœur dégagé</text><path d="M1153 458h-18m6 -5l-6 5 6 5" stroke="#eff2ea" stroke-width="2" fill="none"/><rect x="880" y="375" width="250" height="160" rx="12" fill="#28505a"/><text x="898" y="410" fill="#f2c771">07</text><text x="898" y="455">Collecteurs</text><text x="898" y="488" class="small">Deux chambres et dérivation</text><path d="M873 458h-18m6 -5l-6 5 6 5" stroke="#eff2ea" stroke-width="2" fill="none"/><rect x="600" y="375" width="250" height="160" rx="12" fill="#28505a"/><text x="618" y="410" fill="#f2c771">08</text><text x="618" y="455">Chaudières</text><text x="618" y="488" class="small">Deux nefs décalées</text><path d="M593 458h-18m6 -5l-6 5 6 5" stroke="#eff2ea" stroke-width="2" fill="none"/><rect x="320" y="375" width="250" height="160" rx="12" fill="#28505a"/><text x="338" y="410" fill="#f2c771">09</text><text x="338" y="455">Répartition</text><text x="338" y="488" class="small">Vestibule  /  éventail</text><path d="M313 458h-18m6 -5l-6 5 6 5" stroke="#eff2ea" stroke-width="2" fill="none"/><rect x="40" y="375" width="250" height="160" rx="12" fill="#986c50"/><text x="58" y="410" fill="#f2c771">10</text><text x="58" y="455">Pompage · BOSS</text><text x="58" y="488" class="small">Grande nef + deux boucles</text><path d="M1280 329v18m-5 -6l5 6 5 -6" stroke="#eff2ea" stroke-width="2" fill="none"/><text x="40" y="590">Train arrêté  /  Quartiers abandonnés  /  Écluse  /  Réseau industriel  /  Pompes réactivées</text><text x="40" y="626" class="small">Prochain jalon : valider le Quai jouable avant l’habillage et avant toute génération Meshy de décor.</text></svg>